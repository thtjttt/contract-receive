<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เปลี่ยนรหัสผ่าน | ระบบรับเข้าสัญญาซื้อขาย</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="index.html">
        ระบบรับเข้าสัญญาซื้อขาย
        <small>บริษัท ยงสวัสดิ์ / บริษัท อมตะ</small>
      </a>
      <nav class="nav">
        <a href="index.html">หน้าแรก</a>
        <a href="contracts.html">รายการสัญญาที่ได้รับ</a>
        <a href="add-contract.html">บันทึกรับสัญญา</a>
        <a href="report.html">รายงานประจำวัน</a>
      </nav>
    </div>
  </header>

  <main>
    <form id="password-form" class="panel form login-form" novalidate>
      <h1 class="page-title">เปลี่ยนรหัสผ่าน</h1>
      <p class="page-subtitle" id="password-who"></p>

      <div class="field">
        <label for="current-password">รหัสผ่านปัจจุบัน</label>
        <input id="current-password" type="password" autocomplete="current-password">
        <p class="error" id="current-password-error"></p>
      </div>

      <div class="field">
        <label for="new-password">รหัสผ่านใหม่</label>
        <input id="new-password" type="password" autocomplete="new-password">
        <p class="hint">อย่างน้อย 8 ตัว ควรผสมตัวอักษรกับตัวเลข</p>
        <p class="error" id="new-password-error"></p>
      </div>

      <div class="field">
        <label for="confirm-password">พิมพ์รหัสผ่านใหม่อีกครั้ง</label>
        <input id="confirm-password" type="password" autocomplete="new-password">
        <p class="error" id="confirm-password-error"></p>
      </div>

      <p id="password-error" class="alert" hidden></p>
      <p id="password-success" class="success" hidden></p>

      <div class="form-actions">
        <button type="submit" id="password-button" class="button">เปลี่ยนรหัสผ่าน</button>
        <a href="contracts.html" class="button button-light">ยกเลิก</a>
      </div>
    </form>
  </main>

  <footer class="site-footer">
    บริษัท ยงสวัสดิ์ / บริษัท อมตะ &middot; ระบบรับเข้าสัญญาซื้อขาย
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="data.js"></script>
  <script src="change-password.js"></script>
</body>
</html>
